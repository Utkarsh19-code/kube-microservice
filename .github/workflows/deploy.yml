name: Build and Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**","k8s/**",".github/workflows/deploy.yml"]
permissions: {id-token: write, contents: read}
env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  FRONTEND_ECR_REPOSITORY: ${{ vars.FRONTEND_ECR_REPOSITORY }}
  PRODUCT_API_ECR_REPOSITORY: ${{ vars.PRODUCT_API_ECR_REPOSITORY }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: {role-to-assume: ${{ vars.AWS_ROLE_ARN }}, aws-region: us-east-1}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push API
        run: |
          docker build -t "$ECR_REGISTRY/$PRODUCT_API_ECR_REPOSITORY:${GITHUB_SHA}" ./app/product-api
          docker push "$ECR_REGISTRY/$PRODUCT_API_ECR_REPOSITORY:${GITHUB_SHA}"
      - name: Build and push frontend
        run: |
          docker build -t "$ECR_REGISTRY/$FRONTEND_ECR_REPOSITORY:${GITHUB_SHA}" ./app/frontend
          docker push "$ECR_REGISTRY/$FRONTEND_ECR_REPOSITORY:${GITHUB_SHA}"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: {role-to-assume: ${{ vars.AWS_ROLE_ARN }}, aws-region: us-east-1}
      - name: Deploy through AWS Systems Manager
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          PRODUCT_IMAGE: ${{ vars.ECR_REGISTRY }}/${{ vars.PRODUCT_API_ECR_REPOSITORY }}:${{ github.sha }}
          FRONTEND_IMAGE: ${{ vars.ECR_REGISTRY }}/${{ vars.FRONTEND_ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail
          NAMESPACE=$(base64 -w0 k8s/namespace.yaml)
          API=$(base64 -w0 k8s/product-api.yaml)
          FRONTEND=$(base64 -w0 k8s/frontend.yaml)
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript             --parameters "commands=[
              "set -e",
              "mkdir -p /opt/microservices-demo/k8s",
              "echo $NAMESPACE | base64 -d > /opt/microservices-demo/k8s/namespace.yaml",
              "echo $API | base64 -d | sed 's|IMAGE_PLACEHOLDER|$PRODUCT_IMAGE|g' > /opt/microservices-demo/k8s/product-api.yaml",
              "echo $FRONTEND | base64 -d | sed 's|IMAGE_PLACEHOLDER|$FRONTEND_IMAGE|g' > /opt/microservices-demo/k8s/frontend.yaml",
              "aws ecr get-login-password --region $AWS_REGION | k3s ctr images pull --user AWS:$(aws ecr get-login-password --region $AWS_REGION) $PRODUCT_IMAGE",
              "aws ecr get-login-password --region $AWS_REGION | k3s ctr images pull --user AWS:$(aws ecr get-login-password --region $AWS_REGION) $FRONTEND_IMAGE",
              "k3s kubectl apply -f /opt/microservices-demo/k8s/namespace.yaml",
              "k3s kubectl apply -f /opt/microservices-demo/k8s/product-api.yaml",
              "k3s kubectl apply -f /opt/microservices-demo/k8s/frontend.yaml",
              "k3s kubectl rollout status deployment/product-api -n microservices --timeout=180s",
              "k3s kubectl rollout status deployment/frontend -n microservices --timeout=180s",
              "k3s kubectl get pods -n microservices"
            ]" --query Command.CommandId --output text)
          for i in {1..36}; do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
            echo "SSM status: $STATUS"
            if [ "$STATUS" = "Success" ]; then exit 0; fi
            if [[ "$STATUS" =~ ^(Failed|Cancelled|TimedOut)$ ]]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
              exit 1
            fi
            sleep 5
          done
          exit 1
