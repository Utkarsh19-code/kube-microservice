apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: microservices
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: frontend
          image: IMAGE_PLACEHOLDER
          env: [{name: PRODUCT_API_URL, value: "http://product-api:5000"}]
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 10, periodSeconds: 10}
          resources:
            requests: {cpu: "25m", memory: "48Mi"}
            limits: {cpu: "150m", memory: "128Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: microservices
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 8080, nodePort: 30080}]
  type: NodePort
